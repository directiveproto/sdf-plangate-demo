[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sdf-plangate-demo"
version = "0.1.0"
description = "5-minute PlanGate demo for unsafe-write confirmation gates."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "sdf-plan>=0.1.2",
  "python-dotenv>=1.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
