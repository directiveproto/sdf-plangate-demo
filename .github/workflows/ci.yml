name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -U pip
      - name: Smoke run with output assertions
        run: |
          make run | tee smoke.out
          grep -q "BLOCKED" smoke.out
          grep -q "CONFIRMED" smoke.out
          grep -q "WRITE EXECUTED" smoke.out
      - run: make test
      - name: Marketing asset checks
        run: |
          test -s docs/demo.gif
          grep -q "!\[PlanGate demo\](docs/demo.gif)" README.md
